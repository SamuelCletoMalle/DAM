<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 1</title>

</head>
<body>
    <h1>Sonido</h1>
    <canvas id="miLienzo" width="300" height="300"
    style="border:3px dotted #009900;">
    <script>
        var lienzo=document.getElementById("miLienzo");
        var elem= lienzo.getContext("2d");
        elem.beginPath();
        elem.arc(150,150,50,2,2*Math.PI);
        elem.stroke();
    </script>
</canvas>
</body>
