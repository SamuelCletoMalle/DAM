<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form action="Ej20_mensaje.html" method="POST">
        <label for="usuario">Nombre de Usuario:</label>
        <input type="text" id="usuario" name="usuario" required pattern="[A-Za-z0-9]{6,15}" title="Solo se permiten letras y números, entre 6 y 15 caracteres."><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required minlength="8"><br>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
