<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function getParameterByName(param) {
          param = param.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
          var regex = new RegExp("[\\?&]" + param + "=([^&#]*)"),
          results = regex.exec(location.search);
          return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
        }
        function getQueryVariable(variable) {
            var query = window.location.search.substring(1);
            var vars = query.split("&");
            for (var i=0; i < vars.length; i++) {
                var pair = vars[i].split("=");
                 if(pair[0] == variable) {
                 return pair[1];
                }
            }
            return false;
        }
        function getLineaRecibida() {
    
          var results =  window.location.search.substring(0,150); // o solo (0)
          return results;
        }
        </script>
</head>
<body>
    <h1>Hola</h1>
    sadfas
    <script type="text/javascript">
let d = new Date();
let nombre  = getParameterByName('nombre');
let miApellido  = getQueryVariable('apellido');
 let linea=getLineaRecibida();
document.body.innerHTML = "<h2>Hora:  " + d.getHours() + ":" + d.getMinutes() + ":" + d.getSeconds() +"</h2>"+
"<br>"+ " HOLA: "+nombre+
"<br>"+ "SALUDOS:"+miApellido+
 "<br>"+ "Linea recibida:"+ linea +":" +
"</h2>"
    </script>
</body>
</html>
