                        <button onclick="anterior('carrusel1')">Anterior</button>

                    </div>
                    <h3><i>Camisetas</i></h3>
                    <div class="controles">

                </td>
            </tr>
            <tr>
                <td>
                    <div class="carrusel" id="carrusel3">
                        <div class="foto">
                            <img src="/images/Zapatilla1.jpeg" alt="Camiseta rosa 15€">
                        </div>
                        <div class="foto">
                            <img src="/images/Zapatilla2.jpeg" alt="Camiseta blanca 18€">
                        </div>
                        <div class="foto">
                            <img src="/images/Zapatilla3.jpeg" alt="Camiseta marrón 20€">
                        </div>
                    </div>
                    <h3><i>Zapatillas</i></h3>
                    <div class="controles">
                        <button onclick="anterior('carrusel3')">Anterior</button>

                <td>
                    <div class="carrusel" id="carrusel4">
                        <div class="foto">
                            <img src="/images/Accesorio1.jpeg" alt="Camiseta rosa 15€">

                        <div class="foto">

        </div>

    </div>


    <script>
        const carruseles = {};
    
        function inicializarCarrusel(id) {
            const fotos = document.querySelectorAll(`#${id} .foto`);
            carruseles[id] = { fotos, indice: 0 };
            mostrarFoto(id);
        }
    
        function mostrarFoto(id) {
            const { fotos, indice } = carruseles[id];
            fotos.forEach((foto, i) => {
                foto.style.display = (i === indice) ? "block" : "none";
            });
        }
    
        function cambiarFoto(id, direccion) {
            const carrusel = carruseles[id];
            carrusel.indice = (carrusel.indice + direccion + carrusel.fotos.length) % carrusel.fotos.length;
            mostrarFoto(id);
        }
    
        function siguiente(id) {
            cambiarFoto(id, 1);
        }
    
        function anterior(id) {
            cambiarFoto(id, -1);
        }
    
        inicializarCarrusel("carrusel1");
        inicializarCarrusel("carrusel2");
        inicializarCarrusel("carrusel3");
        inicializarCarrusel("carrusel4");
    </script>
