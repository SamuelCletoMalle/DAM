<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="valor.html"  method="get" oninput=
              "Longitud.value=parseInt(radio.value * 2 * 3.1415); 
               radioAux.value=parseInt(radio.value);
               Longitud2.value=Longitud.value;">
        Longitud del radio: <input type="range" id="ida" name="radio" value="0" min="0" max="100"> 100
        <br>
        Valor del radio: <output name="radioAux" for="asdfasdf"></output>
        <br>
        Valor circunferencia: <output name="Longitud" for="a"></output>
        <input type="hidden" name="Longitud2" value="3.1416"> <!-- para enviar el valor de la circunferencia.-->
       <br> 
        <input type="submit">
    </form>
</body>
</html>
