<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <h1>Presiona una tecla</h1>
    <input type="text" id="mi-input" placeholder="Escribe algo aquí..."> <!-- Campo de texto para la entrada del usuario -->

    <script>
        // Agrega un evento de teclado al input
        document.getElementById("mi-input").addEventListener("keydown", function(event) {
            // Verifica si la tecla presionada es "Enter"
            if (event.key === "Enter") {
                const inputValue = this.value.trim(); // Obtiene el valor del input y elimina espacios
                if (inputValue === "") {
                    alert("Por favor, ingresa un texto antes de presionar Enter."); // Mensaje de error si el input está vacío
                } else {
                    alert("¡Has presionado la tecla Enter! Texto ingresado: " + inputValue); // Muestra el texto ingresado
                }
            }
        });
    </script>
</body>
</html>
