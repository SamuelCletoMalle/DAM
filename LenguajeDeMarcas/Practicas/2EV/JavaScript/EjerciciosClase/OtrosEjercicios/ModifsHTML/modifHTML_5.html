<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="lista">
        <li>elemento 1</li>
        <li>elemento 2</li>
   </ul>
   <script>
     let elemento = document.createElement("li");
     let texto = document.createTextNode("Elemento nuevo");
     let atributo = document.createAttribute("class");
     atributo.value="activo";
     let comentario = document.createComment("Elemento creado desde JavaScript");
     elemento.appendChild(texto);
     elemento.setAttributeNode(atributo);
     elemento.appendChild(comentario);
     document.getElementById("lista").appendChild(elemento);
   </script>
</body>
</html>
