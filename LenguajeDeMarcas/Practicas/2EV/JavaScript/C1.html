<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora con funciones</title>
</head>
<body>
    <script>
        // Funciones para realizar cada operación matemática
        function sumar(a, b) {
            return a + b;
        }

        function restar(a, b) {
            return a - b;
        }

        function multiplicar(a, b) {
            return a * b;
        }

        function dividir(a, b) {
            return b !== 0 ? a / b : "Error: División por 0 no permitida";
        }

        // Función principal que selecciona la operación a realizar
        function calcular(num1, num2, operacion) {
            switch (operacion) {
                case "+": return sumar(num1, num2);
                case "-": return restar(num1, num2);
                case "*": return multiplicar(num1, num2);
                case "/": return dividir(num1, num2);
                default: return "Operación no válida";
            }
        }

        // Bucle para solicitar datos y realizar operaciones hasta que un número sea 0
        let continuar = true;

        while (continuar) {
            // Solicitar el primer número
            let num1 = prompt("Introduce el primer número (0 para salir):");
            if (num1 === null) break; // Si el usuario cancela, salir
            num1 = parseFloat(num1);

            // Verificar si es un número válido
            if (isNaN(num1)) {
                alert("Por favor, introduce un número válido.");
                continue;
            }

            // Solicitar el segundo número
            let num2 = prompt("Introduce el segundo número (0 para salir):");
            if (num2 === null) break; // Si el usuario cancela, salir
            num2 = parseFloat(num2);

            // Verificar si es un número válido
            if (isNaN(num2)) {
                alert("Por favor, introduce un número válido.");
                continue;
            }

            // Si uno de los números es 0, terminar el bucle
            if (num1 === 0 || num2 === 0) {
                console.log("Operación finalizada.");
                break;
            }

            // Solicitar la operación matemática
            let operacion = prompt("Introduce la operación (+, -, * o /):");
            if (operacion === null) break; // Si el usuario cancela, salir

            // Validar la operación
            if (!["+", "-", "*", "/"].includes(operacion)) {
                alert("Operación no válida. Introduce +, -, * o /.");
                continue;
            }

            // Calcular y mostrar el resultado en la consola
            let resultado = calcular(num1, num2, operacion);
            console.log(`Resultado de ${num1} ${operacion} ${num2} = ${resultado}`);
        }
    </script>
</body>
</html>
