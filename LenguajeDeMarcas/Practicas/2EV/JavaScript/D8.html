<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos de JavaScript</title>
</head>
<body>
    <h1 id="titulo">JavaScript</h1>
    <p id="parrafo">Aprende a programar en JavaScript como parte de este curso</p>

    <script>
        // Cambiar el fondo del h1 a negro
        const titulo = document.getElementById("titulo");
        titulo.style.backgroundColor = "black"; // Fondo negro para el h1
        titulo.style.color = "white"; // Texto blanco para el h1
        titulo.style.textAlign = "center"; // Centrar el texto

        // Estilizar el párrafo
        const parrafo = document.getElementById("parrafo");
        parrafo.style.fontStyle = "italic"; // Texto en cursiva
        parrafo.style.textAlign = "center"; // Centrar el texto
    </script>
</body>
</html>
